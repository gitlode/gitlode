# CI workflow: validates dependencies, source, development output, and release artifacts.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches:
      - main
      - "integration/**"

permissions:
  contents: read # Required to checkout repository contents.

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check dependency versions
        run: npm run syncpack:check

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check architecture
        run: npm run architecture:check

      - name: Build development projects
        run: npm run build:dev

      - name: Check generated artifacts are up to date
        run: npm run schema:check -w gitlode

      - name: Run source tests
        run: npm test

      - name: Collect coverage
        run: npm run test:coverage

      - name: Build release artifact
        run: npm run build:release

      - name: Validate package metadata and release output
        run: npm run validate:package -w gitlode

      - name: Test packed artifact
        run: npm run test:package:artifact -w gitlode

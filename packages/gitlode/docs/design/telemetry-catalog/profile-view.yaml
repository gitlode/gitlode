schema_version: 1
status: accepted_target

layout:
  title: Profile
  indentation_spaces: 2
  kind_sections: false
  kind_badges: false
  empty_report: omit
  notes:
    - Scope and observation identity determine hierarchy; signal kind only determines fields and tie order.
    - No observation name has a presentation-specific label, group, or preferred order.
    - Table borders, fixed widths, padding, and formatter-driven wrapping are not used.

generic_hierarchy:
  group_by: instrumentation_scope_name_and_version
  scope_label:
    version_present: "Scope: <scope-name>@<version>"
    version_absent: "Scope: <scope-name>"
  namespace_segments: 2
  root_prefix: "/"
  remaining_segments: joined_observation_row
  short_name_values: group_node_line
  group_node_collision: repeat_absolute_observation_name_on_child_rows
  malformed_dot_name: quoted_absolute_observation_row
  attributes_before_namespace_children: true
  unknown_admitted_identity: include

ordering:
  string_comparison: UTF-16_code_units
  scope:
    - name
    - missing_version_before_present_version
    - version
  sibling_names: observation_name
  kind_tie_order:
    - span
    - counter
    - histogram
  point_tie_order:
    - sorted_attribute_key
    - typed_attribute_value
  attribute_value_type_order:
    - boolean
    - number
    - string

tokens:
  ordinary_pattern: "[A-Za-z0-9_.@-]+"
  string_quoting: JSON
  additionally_escaped:
    - C1_controls
    - Unicode_line_separators
    - Unicode_bidi_controls
  typed_string_disambiguation:
    - boolean_literals
    - finite_number_strings
  truncate_identity: false

attribute_rendering:
  layout: one_per_line
  ordering: original_key_code_units
  relative_key_rule: remove_grouping_namespace_only_at_dot_segment_boundary
  absolute_key_prefix: "/"
  inheritance: false
  hoisting: false
  span_summary:
    single: retained_value
    distinct: retained_value_with_span_frequency
    min_max: retained_endpoints
    coverage_count: retain_when_incomplete
    conflicts_and_overflow: structured_local_notification
  metric_value: typed_scalar

measurement_fields:
  span:
    - calls
    - total
    - avg
    - max
    - errors
  counter:
    - value
    - unit
  histogram:
    - samples
    - total
    - avg
    - min
    - max
  unavailable: "—"
  histogram_buckets: retained_but_not_displayed
  explicit_zero: display
  average_requires_matching_positive_coverage: true

unit_rendering:
  significant_digits: 4
  trailing_fractional_zeroes: remove
  promotion_after_rounding: true
  nonzero_must_not_render_as_plain_zero: true
  s:
    human_units:
      - ns
      - µs
      - ms
      - s
  By:
    human_units:
      - B
      - KiB
      - MiB
      - GiB
  annotated_entity: human-readable_plural_label
  unknown: canonical_unit
  extreme_magnitude: scientific_notation

diagnostic_rendering:
  overall_summary: only_when_diagnostics_exist
  marker: "!"
  placement:
    report: profile_start
    scope: scope_start
    observation: beside_observation
    point: beside_matching_typed_point
    exact_attribute: attribute_supplement
  missing_only_target: issue_only_row
  shared_instrument_issue: one_name_only_row_before_retained_points
  duplicate_inline_and_notification: false
  occurrence_count_is_loss_amount: false
  labels:
    span_group_overflow: Span groups truncated
    span_attribute_value_overflow: Span attribute values truncated
    metric_point_overflow: Metric datapoints truncated
    attribute_reducer_conflict: Span attribute invariant violated
    invalid_aggregation: Invalid aggregation discarded
    lifecycle_failure: Telemetry lifecycle stage failed
    diagnostic_overflow: Additional diagnostics omitted

styling:
  title_scope_namespace: sectionHeading
  observation_name: default
  field_and_attribute_key: fieldKey
  available_value: primaryValue
  unit: unitSuffix
  separator: separator
  warning_marker: warnBadge
  info_marker_and_explanation: default
  profile_uses_application_success_style: false
  indentation_outside_styled_tokens: true
  escaped_before_decoration: true
  styled_plain_text_parity: true

validation:
  - every accepted and unknown admitted observation uses the same generic hierarchy
  - per-observation groups, labels, order entries, Plugins buckets, and fallback buckets are prohibited
  - typed point identity and kind remain available for deterministic ties and diagnostic placement
  - every ProfileDiagnostic code has a concise cause label
  - unavailable fields are driven by report masks and duration coverage, not retained diagnostic detail

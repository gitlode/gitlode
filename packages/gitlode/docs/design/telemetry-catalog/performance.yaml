schema_version: 1
status: accepted_target

states:
  legacy_off:
    revision: migration baseline
    profile: disabled
  target_off:
    revision: redesigned implementation
    profile: disabled
  target_on:
    revision: redesigned implementation
    profile: enabled

comparisons:
  disabled_overhead:
    candidate: target_off
    baseline: legacy_off
    wall_clock_maximum_ratio: 1.05
    peak_rss_allowed_increase:
      greater_of:
        absolute_mib: 8
        baseline_ratio: 0.05
  profile_overhead:
    candidate: target_on
    baseline: target_off
    wall_clock_maximum_ratio: 1.15
    peak_rss_allowed_increase:
      greater_of:
        absolute_mib: 32
        baseline_ratio: 0.15
  legacy_profile_enabled:
    disposition: not_compared
    rationale: the custom and target profilers intentionally observe different signal shapes and volumes

wall_clock_evaluation:
  statistic: median paired candidate-to-baseline ratio minus one
  minimum_fixture_median_seconds: 10
  target_fixture_median_seconds:
    minimum: 10
    maximum: 30
  repetitions:
    warmup: 2
    measured_pairs: 7
    order:
      - A-B
      - B-A
      - alternate for all measured pairs
  inconclusive_when:
    - baseline median absolute deviation exceeds 5 percent of its median
    - candidate median absolute deviation exceeds 5 percent of its median
    - recorded environmental interference invalidates the run
    - a child process does not exit successfully
    - behavioral equivalence fails
    - environment fingerprint is incompatible with the baseline

peak_rss:
  source: external sampling of the target gitlode child process
  maximum_sampling_interval_ms: 25
  excludes:
    - benchmark harness RSS
  notes:
    - CPU time may be recorded as supplementary data but is not an initial acceptance gate.

bounded_growth:
  workload_scales:
    - N
    - 4N
  fixed:
    - observation identities
    - attribute sets
  requirements:
    - span aggregate group count does not grow
    - metric datapoint count does not grow
    - histogram bucket count does not grow
    - collector does not retain raw spans or histogram samples
    - profile-specific peak RSS delta grows by no more than 8 MiB
  profile_specific_peak_rss_delta: peak RSS with profile enabled minus peak RSS with profile disabled

fixtures:
  - id: commit_heavy_repository
    adapters:
      - isomorphic-git
      - git-cli
    covers:
      - long linear history
      - periodic branches and merges
      - overlapping refs
      - incremental boundary
      - small text changes
      - commit traversal, object access, DAG, projection, and output

  - id: file_heavy_repository
    adapters:
      - isomorphic-git
      - git-cli
    covers:
      - multiple changes per commit
      - added, modified, and deleted files
      - UTF-8 text
      - binary and size skips
      - multiple output rotations
      - blob, expansion, line-diff, projection, and output work

  - id: plugin_heavy_projection
    plugin_characteristics:
      - deterministic
      - no external I/O
      - success and skip outcomes
      - multiple registrations
      - same package under different namespaces
    excludes:
      - network
      - IPC
      - arbitrary script workloads

  - id: aggregation_scale
    repository_access: none
    input: deterministic fake fact and record sources
    covers:
      - N versus 4N bounded growth
      - disabled recorder path
      - enabled metric recording
      - span aggregation without raw-observation retention

fixture_calibration:
  phase: 0
  permitted_quantity:
    type: integer
    minimum: target initial manifest quantity
  procedure:
    - run every pilot with the cataloged warmup and measured-run counts
    - validate child success and deterministic behavior before using a pilot for selection
    - double the candidate workload until the first legacy_off median at or above 10 seconds brackets the lower threshold
    - refine the bracket with deterministic integer binary search
    - select the smallest permitted quantity whose observed legacy_off median is at least 10 seconds
    - require the selected quantity's median to be no more than 30 seconds
    - record commit, file, plugin, and rotation quantities in the manifest
    - do not recalibrate during migration comparisons
  stability:
    maximum_median_absolute_deviation_ratio: 0.05
    unstable_pilot: inconclusive
    non_monotonic_lower_threshold_classification: inconclusive
    automatic_retry_or_cherry_pick: prohibited
  no_acceptable_quantity:
    conditions:
      - the initial permitted quantity exceeds 30 seconds
      - adjacent integer quantities bracket the window below 10 seconds and above 30 seconds
      - integer doubling cannot continue safely before reaching 10 seconds
    result: failed calibration with preserved evidence
  evidence:
    progress_write: atomic after every completed pilot
    atomic_write: replace a temporary sibling on the artifact filesystem
    progress_filename: <fixture>-<adapter>-calibration-progress.json
    failure_filename: <fixture>-<adapter>-calibration-failure.json
    attempt_order: execution order
    progress_fields:
      - fixture and adapter
      - baseline and benchmark revisions
      - calibration target recipe hash
      - quantity
      - unrounded median and median absolute deviation
      - artifact-safe warmup and measured runs
      - child and behavioral validation
      - normalized behavioral evidence
    terminal_failure_write: required after workflow preparation begins
    successful_artifact_pilot_history: complete
    temporary_output_and_checkpoint_paths: prohibited
    interrupted_attempt_reuse: prohibited
  shorter_fixture_policy: semantic or volume evidence only; not a wall-clock gate

execution:
  build: clean release build
  subject: installed or bundled CLI as a child process
  cli:
    quiet: true
    profile_enabled_semantics: collect and build the report while suppressing terminal rendering
  repository:
    same_snapshot_within_comparison: true
  output:
    location: separate temporary directory per run on the same filesystem class
    reuse_written_files: false
  cache:
    comparison_state: after warmup
  comparison_order: interleaved paired runs

environment_fingerprint:
  required:
    - operating system and version
    - architecture
    - CPU model and logical CPU count
    - total memory
    - Node version
    - npm version
    - Git version
    - Git adapter
    - build mode
    - repository revision
    - calibration target recipe hash
    - sealed manifest hash when the final manifest is complete
    - benchmark script revision
    - profile state
    - warmup and measurement counts
  incompatible_baseline_when:
    - Node major differs
    - operating system differs
    - architecture differs
    - Git version differs for a git-cli comparison
    - calibration target recipe hash differs
    - sealed manifest hashes differ when both fingerprints contain one

run_measurements:
  - wall-clock elapsed time
  - child-process exit result
  - peak RSS
  - output bytes
  - output files
  - records
  - commits
  - skipped diffs
  - ProfileReport JSON UTF-8 byte size
  - span aggregate group count
  - total ended span count
  - counter datapoint count
  - histogram datapoint count
  - diagnostic count

trace_volume:
  prohibited_scaling_spans:
    - per-record projection
    - per-output-write
    - per-blob
    - per-diff
    - per-commit file expansion
  non_command_spans: explainable by cataloged bounded operations
  git_cli_command_spans:
    scaling: permitted only with actual command invocations
    requirements:
      - span count equals command-start count
      - telemetry causes no additional command
  plugin_created_spans: report separately from host volume

report_size:
  maximum_bytes: 1048576
  measurement: UTF-8 byte length of JSON.stringify(ProfileReport)
  applies_to:
    - commit_heavy_repository
    - file_heavy_repository
    - plugin_heavy_projection
  scope: fixture manifest's fixed plugin count; not an absolute guarantee for unbounded configuration size

microbenchmarks:
  hard_cross_machine_nanoseconds_per_operation_gate: false
  uses:
    - verify clock-read counts
    - locate disabled and enabled hot-path regressions
    - compare branches on one environment
    - verify instruments are not recreated on hot paths
  formal_acceptance_source:
    - end-to-end paired measurements
    - bounded-growth criterion

baseline_artifacts:
  phase: 0
  required:
    - benchmark manifest
    - environment fingerprint
    - unrounded raw run results
    - calculated paired ratios
    - behavioral equivalence result
    - baseline Git revision
  storage: benchmark artifacts rather than embedded design-document data

failure_process:
  steps:
    - check measurement noise
    - inspect observation volume
    - inspect no-op path, clock access, attribute allocation, and instrument lifecycle
    - inspect collector retention and SDK views
    - improve and repeat with the unchanged manifest
  threshold_change: prohibited without explicit design review
  reviewed_exception_requires:
    - fixture and adapter
    - measured result
    - cause
    - acceptance rationale
    - impact
    - reevaluation condition
  catalog_reduction: requires an explicit design update
